
name: AeroStride CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: aerostride
  ECR_REGISTRY: 149471050535.dkr.ecr.us-east-1.amazonaws.com

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t aerostride:${{ github.sha }} .

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        if: github.event_name == 'push'
        run: |
          docker tag aerostride:${{ github.sha }} \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Push image to Amazon ECR
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Update Kubernetes deployment image
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          manifest = Path("k8s/deployment.yaml")
          content = manifest.read_text()

          image = (
              f"{os.environ['ECR_REGISTRY']}/"
              f"{os.environ['ECR_REPOSITORY']}:"
              f"{os.environ['GITHUB_SHA']}"
          )

          lines = content.splitlines()
          updated = []
          found = False

          for line in lines:
              if line.lstrip().startswith("image:"):
                  indent = line[:len(line) - len(line.lstrip())]
                  line = f"{indent}image: {image}"
                  found = True
              updated.append(line)

          if not found:
              raise SystemExit("No image: entry found in k8s/deployment.yaml")

          manifest.write_text("\n".join(updated) + "\n")
          print(f"Updated deployment image to: {image}")
          PY

      - name: Commit and push Kubernetes manifest
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes to commit."
          else
            git commit -m "Update AeroStride image to ${GITHUB_SHA} [skip ci]"
            git push
          fi
